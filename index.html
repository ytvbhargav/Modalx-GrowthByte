<script>
/* The artifact wrapper owns <head>, so if no viewport tag is supplied a phone
   lays out at ~980px, matches the >=640px desktop rule and scales the whole app
   down. Add one before first paint if it is missing. */
(function () {
  if (!document.querySelector('meta[name="viewport"]')) {
    var m = document.createElement("meta");
    m.name = "viewport";
    m.content = "width=device-width, initial-scale=1, viewport-fit=cover";
    (document.head || document.documentElement).appendChild(m);
  }
})();
</script>

<style>
  /* One product, one loop: say it -> it gets made -> it goes live -> it gets
     measured -> it decides the next one, which returns to step 1 already
     written. Unbranded on purpose. Nothing moves until the user taps. */
  :root{
    --bg:#0a0c10; --card:#10141a; --card-2:#161b22; --card-3:#1c222b;
    --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.18);
    --ink:#e6e9ef; --ink-2:#b8bdc7; --ink-3:#7d838f; --ink-4:#565c67;
    --accent:#2dd4bf; --accent-2:#5eead4;
    --warn:#fbbf24; --bad:#fb7185;
    --sans:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#06070a;color:var(--ink);font-family:var(--sans);
            -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
            overscroll-behavior:none}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;
         transition:transform .08s ease,filter .15s ease,border-color .15s ease}
  button:active{transform:scale(.978)}
  button[disabled]{opacity:.38;pointer-events:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}

  .app{width:100%;min-height:100dvh;max-width:430px;margin:0 auto;background:var(--bg);
       display:flex;flex-direction:column;position:relative;overflow:hidden}

  /* --------------------------------------------------------------- start */
  .start{position:absolute;inset:0;z-index:20;background:var(--bg);
         display:flex;flex-direction:column;align-items:center;justify-content:center;
         gap:15px;padding:34px;text-align:center}
  .start[hidden]{display:none}
  .start .eyebrow{font-size:10px;letter-spacing:.16em;color:var(--ink-4)}
  .start h1{font-size:24px;margin:0;letter-spacing:-.02em;line-height:1.24}
  .start h1 i{font-style:normal;color:var(--accent)}
  .start p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.55;max-width:28ch}
  .go{background:var(--accent);color:#06121a;font-weight:700;font-size:14.5px;
      padding:14px 26px;border-radius:999px;margin-top:8px}
  .go:hover{filter:brightness(1.07)}

  /* ------------------------------------------------------- the loop rail */
  .rail{padding:max(14px,env(safe-area-inset-top)) 16px 10px}
  .track{display:flex;align-items:center;gap:0}
  .stg{flex:1;display:flex;align-items:center;gap:0;padding:0;height:34px}
  .stg .d{flex:none;width:9px;height:9px;border-radius:50%;background:var(--card-3);
          transition:background .25s ease,box-shadow .25s ease}
  .stg .ln{flex:1;height:1.5px;background:var(--card-3)}
  .stg.on .d{background:var(--accent);box-shadow:0 0 0 4px color-mix(in oklab,var(--accent) 22%,transparent)}
  .stg.past .d{background:var(--accent-2)}
  .stg.past .ln{background:color-mix(in oklab,var(--accent) 45%,var(--card-3))}
  .stg .d.loop{width:11px;height:11px;border:1.5px dashed var(--ink-4);background:none}
  .stg.on .d.loop,.stg.past .d.loop{border-color:var(--accent);background:none;box-shadow:none}
  .meta{display:flex;align-items:baseline;gap:7px;margin-top:4px;min-width:0}
  .meta .st{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .meta .cy{font-size:10px;color:var(--ink-4);margin-left:auto}
  .chip{display:flex;align-items:center;gap:5px;background:var(--card-2);border:1px solid var(--line);
        border-radius:999px;padding:4px 9px;font-size:10.5px;color:var(--ink-2);flex:none}
  .chip:hover{color:var(--ink);border-color:var(--line-2)}

  .menu{position:absolute;top:60px;right:14px;background:var(--card);border:1px solid var(--line);
        border-radius:12px;padding:5px;z-index:12;min-width:180px;box-shadow:0 18px 44px rgba(0,0,0,.6)}
  .menu[hidden]{display:none}
  .menu button{display:block;width:100%;text-align:left;padding:10px 11px;border-radius:8px;
               font-size:13.5px;color:var(--ink-2)}
  .menu button:hover{background:var(--card-2);color:var(--ink)}

  /* ---------------------------------------------------------------- head */
  .head{padding:2px 20px 10px;text-align:center}
  .head h2{font-size:20px;margin:0 0 4px;letter-spacing:-.015em}
  .head p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.45}

  /* ---------------------------------------------------------------- body */
  .screen{flex:1;overflow:auto;padding:2px 16px 8px;scrollbar-width:none}
  .screen::-webkit-scrollbar{display:none}
  .lbl{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-4);
       margin:10px 0 8px}

  .fade{opacity:0;transform:translateY(7px);animation:in .3s ease forwards}
  @keyframes in{to{opacity:1;transform:none}}

  /* pick an account */
  .pick{display:grid;gap:8px;margin-top:4px}
  .pick button{display:flex;align-items:center;gap:11px;background:var(--card);
               border:1px solid var(--line);border-radius:13px;padding:12px 13px;text-align:left}
  .pick button:hover{border-color:var(--accent)}
  .pick .em{flex:none;width:34px;height:34px;border-radius:10px;background:var(--card-2);
            display:grid;place-items:center;font-size:11px;font-weight:700;
            letter-spacing:.04em;color:var(--accent)}
  .pick .nm{display:block;font-size:14px;font-weight:600}
  .pick .sb{display:block;font-size:11.5px;color:var(--ink-4);margin-top:2px}

  /* 1 - say it */
  .mic{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);
       border-radius:15px;padding:15px 16px}
  /* the do-this-now variant -- unmistakably a button */
  .mic.act{border-color:var(--accent);
           background:color-mix(in oklab,var(--accent) 9%,var(--card))}
  .mic.act .orb{background:var(--accent)}
  .mic.act .wave i{background:#06121a}
  .mic.act .tx b{color:var(--ink)}
  .mic .arrow{margin-left:auto;color:var(--accent);font-size:18px}
  .mic.live{border-color:var(--accent)}
  .orb{flex:none;width:44px;height:44px;border-radius:50%;background:var(--card-2);
       display:grid;place-items:center}
  .mic.live .orb{background:color-mix(in oklab,var(--accent) 20%,var(--card-2))}
  .wave{display:flex;align-items:center;gap:2.5px;height:20px}
  .wave i{display:block;width:2.5px;border-radius:2px;background:var(--ink-4);height:4px}
  .mic.live .wave i{background:var(--accent);animation:bob .85s ease-in-out infinite}
  @keyframes bob{0%,100%{height:4px}50%{height:18px}}
  .mic .tx{font-size:13px;color:var(--ink-3)}
  .mic .tx b{display:block;color:var(--ink);font-weight:600;font-size:13.5px;margin-bottom:2px}

  .said{background:color-mix(in oklab,var(--accent) 12%,var(--card));border-radius:15px 15px 15px 5px;
        padding:13px 15px;font-size:14px;line-height:1.5;margin-top:9px}
  .said .who{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
             color:var(--accent);font-weight:700;margin-bottom:5px}
  .caret{display:inline-block;width:2px;height:15px;background:var(--accent);
         vertical-align:-2px;margin-left:2px;animation:blink 1s step-end infinite}
  @keyframes blink{50%{opacity:0}}
  .snd{background:none;border:0;padding:4px 0 4px 8px;font-size:10px;color:var(--ink-4);
       letter-spacing:.04em}
  .snd:hover{color:var(--ink-2)}
  .snd[aria-pressed="false"]{text-decoration:line-through}

  .carry{display:flex;gap:7px;align-items:flex-start;font-size:11.5px;color:var(--ink-4);
         margin-top:9px;line-height:1.45}
  .carry b{color:var(--accent);font-weight:700}

  /* 2 - it gets made */
  .made{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .asset{background:var(--card);border:1px solid var(--line);border-radius:13px;
         padding:11px;text-align:left}
  .asset:hover{border-color:var(--line-2)}
  .asset .kind{font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;
               color:var(--accent);font-weight:700}
  .asset .cap{display:block;font-size:12.5px;font-weight:600;line-height:1.35;margin:6px 0 8px}
  .asset .frame{display:block;height:54px;border-radius:8px;
                background:linear-gradient(145deg,var(--card-3),var(--card-2));
                border:1px solid var(--line);display:grid;place-items:center;
                font-size:9.5px;color:var(--ink-4);letter-spacing:.06em}
  .hitl{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
        border-radius:12px;padding:11px 13px;margin-top:10px;font-size:11.5px;
        color:var(--ink-3);line-height:1.45}
  .hitl .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--warn)}
  .hitl b{color:var(--ink-2)}

  /* 3 - it goes live (the trace) */
  .trace{display:flex;flex-direction:column;gap:7px}
  .ev{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
      border-radius:11px;padding:9px 11px;font-size:12.5px;color:var(--ink-2);
      align-self:flex-start;max-width:97%}
  .ev .src{font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;
           color:var(--accent);display:block;margin-bottom:1px}
  .ev .dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .ev.warn .dot{background:var(--warn)} .ev.warn .src{color:var(--warn)}
  .ev.done{border-color:color-mix(in oklab,var(--accent) 40%,transparent)}

  /* 4 - what it did */
  .post{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
        border-radius:14px;padding:12px;margin-bottom:9px}
  .post:hover{border-color:var(--line-2)}
  .post .t{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px}
  .post .t .ch{margin-left:auto;color:var(--ink-4);font-size:15px;font-weight:400}
  .tag{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
       padding:3px 7px;border-radius:999px}
  .tag.yes{color:var(--accent);background:color-mix(in oklab,var(--accent) 16%,transparent)}
  .tag.no{color:var(--bad);background:color-mix(in oklab,var(--bad) 16%,transparent)}
  .post .m{font-size:11px;color:var(--ink-4);margin-top:3px}
  .res{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
  .res > span{display:block;background:var(--card-2);border-radius:9px;padding:7px 6px;text-align:center}
  .res .k{display:block;font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-4)}
  .res .v{display:block;font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:1px}
  .res .v.dn{color:var(--bad)}

  /* one tab per surface the same piece of work lands on */
  .tabs{display:flex;gap:3px;background:var(--card);border:1px solid var(--line);
        border-radius:11px;padding:3px;margin:2px 0 10px;
        overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:1 0 auto;padding:7px 9px;border-radius:8px;font-size:11px;font-weight:600;
               color:var(--ink-4);white-space:nowrap}
  .tabs button[aria-selected="true"]{background:var(--card-3);color:var(--ink)}
  .tabs button:hover{color:var(--ink-2)}

  .srow{display:grid;grid-template-columns:1fr auto 12px;gap:7px 10px;align-items:center;
        width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
        border-radius:12px;padding:11px 12px;margin-bottom:7px}
  .srow:hover{border-color:var(--line-2)}
  .srow .sk{grid-column:1;font-size:12.5px;font-weight:600;line-height:1.3;
            overflow-wrap:anywhere}
  .srow .sm{grid-column:2;align-self:center;text-align:right;font-size:13px;font-weight:650;
            color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.2}
  .srow .sm em{display:block;font-style:normal;font-size:8.5px;font-weight:600;
               letter-spacing:.07em;text-transform:uppercase;color:var(--ink-4);margin-top:1px}
  .srow .sm.off{color:var(--ink-4)}
  .srow .sc{grid-column:3;grid-row:1;align-self:center;color:var(--ink-4);font-size:14px}
  .srow .wide{grid-column:1/4;display:block}
  .srow .sv{grid-column:1/4;font-size:11px;color:var(--ink-4);font-variant-numeric:tabular-nums}
  .srow .sv .spd{font-weight:600;color:var(--ink-3)}
  .srow .sv .spd.slow{color:var(--warn)}

  /* magnitude bars -- one scale, thin marks, rounded data end */
  .trk2{display:block;height:7px;background:var(--card-3);border-radius:4px;overflow:hidden}
  .fl2{display:block;height:100%;border-radius:4px;background:var(--accent);
       transition:width .5s cubic-bezier(.2,.7,.2,1)}
  .fl2.ghost{background:var(--card-3);box-shadow:inset 0 0 0 1px var(--line-2)}
  .fl2.zero{background:var(--bad)}

  /* rank plot -- 1st at the left, with where it moved from */
  .rank{display:block;position:relative;height:16px;margin:1px 0}
  .rank::before{content:"";position:absolute;left:0;right:0;top:7px;height:1.5px;
                background:var(--card-3);border-radius:1px}
  .rank i{position:absolute;top:4px;width:8px;height:8px;border-radius:50%;margin-left:-4px}
  .rank .now{background:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 22%,transparent)}
  .rank .was{background:none;box-shadow:inset 0 0 0 1.5px var(--ink-4)}
  .rank .move{top:7px;height:1.5px;border-radius:1px;margin-left:0;
              background:color-mix(in oklab,var(--accent) 55%,transparent)}
  .rank .miss{left:100%;background:none;box-shadow:inset 0 0 0 1.5px var(--bad)}
  .scale{display:flex;justify-content:space-between;font-size:9px;color:var(--ink-4);
         letter-spacing:.05em;padding:0 2px;margin:-2px 0 4px}

  /* citation share -- one cell per tracked prompt */
  .share{background:var(--card);border:1px solid var(--line);border-radius:12px;
         padding:12px;margin-bottom:9px}
  .cells{display:flex;gap:4px}
  .cells i{flex:1;height:22px;border-radius:5px;background:var(--card-3)}
  .cells i.on{background:var(--accent)}
  .sharen{font-size:11.5px;color:var(--ink-3);margin-top:8px}
  .sharen b{color:var(--ink);font-weight:700}
  .mark{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;
        box-shadow:inset 0 0 0 1.5px var(--bad);margin-right:7px}
  .mark.on{background:var(--accent);box-shadow:none}
  .srcp{font-size:11px;color:var(--ink-4)}

  /* creators -- reach against what it returned, on their own scales */
  .pair{display:grid;grid-template-columns:38px 1fr 30px;gap:7px;align-items:center;
        margin-top:4px}
  .pair em{font-style:normal;font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;
           color:var(--ink-4)}
  .pair b{font-size:10.5px;color:var(--ink-3);text-align:right;font-weight:600;
          font-variant-numeric:tabular-nums}

  .read{border-radius:12px;padding:11px 12px;font-size:12.5px;line-height:1.5;margin-top:9px}
  .read.pos{background:color-mix(in oklab,var(--accent) 11%,var(--card));color:var(--ink-2)}
  .read.gap{background:var(--card);border:1px solid color-mix(in oklab,var(--warn) 34%,transparent);
            color:var(--ink-2);margin-top:7px}
  .read .h{display:block;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
           font-weight:700;margin-bottom:4px}
  .read.pos .h{color:var(--accent)}
  .read.gap .h{color:var(--warn)}

  /* 5 - it decides the next one */
  .fmt{display:grid;grid-template-columns:86px 1fr 34px 12px;gap:9px;align-items:center;
       width:100%;text-align:left;font-size:12px;padding:7px 4px;border-radius:9px}
  .fmt:hover{background:var(--card)}
  .fmt .n{color:var(--ink-2)}
  .trk{display:block;height:8px;background:var(--card-2);border-radius:5px;overflow:hidden}
  .fil{display:block;height:100%;border-radius:5px;background:var(--accent);width:0;
       transition:width .6s cubic-bezier(.2,.7,.2,1)}
  .fmt .p{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .fmt .c{color:var(--ink-4);font-size:14px}
  .found{background:color-mix(in oklab,var(--accent) 11%,var(--card));border-radius:12px;
         padding:12px;font-size:13px;line-height:1.5;color:var(--ink-2);margin-top:10px}
  .found b{color:var(--ink)}
  .brief{background:var(--card);border:1px solid color-mix(in oklab,var(--accent) 38%,transparent);
         border-radius:14px;padding:13px;margin-top:10px}
  .brief .h{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);
            font-weight:700;margin-bottom:6px}
  .brief .a{font-size:13.5px;line-height:1.5}
  .brief .w{font-size:11.5px;color:var(--ink-4);margin-top:7px;line-height:1.45}

  /* --------------------------------------------------------------- sheet */
  .scrim{position:absolute;inset:0;background:rgba(4,5,8,.66);z-index:14;
         opacity:0;animation:fade .18s ease forwards}
  .scrim[hidden]{display:none}
  @keyframes fade{to{opacity:1}}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:15;background:var(--card);
         border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:8px 18px 20px;
         max-height:78%;overflow:auto;scrollbar-width:none;
         transform:translateY(100%);animation:up .26s cubic-bezier(.2,.8,.2,1) forwards}
  .sheet[hidden]{display:none}
  .sheet::-webkit-scrollbar{display:none}
  @keyframes up{to{transform:none}}
  .grab{width:36px;height:4px;border-radius:3px;background:var(--card-3);margin:2px auto 12px}
  .sheet h3{font-size:16px;margin:0 0 3px;letter-spacing:-.01em}
  .sheet .sub{font-size:11.5px;color:var(--ink-4);margin-bottom:12px}
  .row{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
  .row .rk{color:var(--ink-4);flex:none;width:94px}
  .row .rv{color:var(--ink-2);line-height:1.45}
  .row .rv b{color:var(--ink)}
  .close{width:100%;background:var(--card-2);border-radius:11px;padding:12px;
         font-size:13.5px;margin-top:14px;color:var(--ink-2)}
  .close:hover{color:var(--ink)}

  /* ---------------------------------------------------------------- foot */
  .foot{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);
        padding:9px 16px max(14px,env(safe-area-inset-bottom))}
  .foot .cap{font-size:10.5px;color:var(--ink-4);flex:1;line-height:1.35}
  .nav{background:var(--card-2);border:1px solid var(--line);border-radius:999px;
       padding:10px 15px;font-size:12.5px;font-weight:600}
  .nav:hover{border-color:var(--line-2)}
  .nav.pri{background:var(--accent);color:#06121a;border-color:transparent;padding:10px 17px}
  .nav.pri:hover{filter:brightness(1.07)}

  @media (min-width:640px){
    body{display:grid;place-items:center;min-height:100dvh;padding:26px}
    .app{min-height:0;height:min(800px,calc(100dvh - 52px));border-radius:30px;
         box-shadow:0 0 0 10px #14161c,0 0 0 11px #2a2e38,0 30px 70px rgba(0,0,0,.65)}
  }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>

<div class="app">
  <div class="start" id="start">
    <div class="eyebrow">INTERACTIVE CONCEPT</div>
    <h1>Say it once.<br>Then let the <i>results</i><br>write the next one.</h1>
    <p>An end-to-end system. AI makes the work, interprets what it did,
       and sharpens what comes next.</p>
    <button class="go" onclick="begin()">Try Yourself &nbsp;&rarr;</button>
  </div>

  <div class="rail">
    <div class="track" id="track"></div>
    <div class="meta">
      <span class="st" id="stage"></span>
      <span class="cy" id="cycle"></span>
      <button class="snd" id="snd" aria-pressed="true" onclick="toggleSound()">Sound</button>
      <button class="chip" id="chip" onclick="toggleMenu()" aria-haspopup="true">
        <span id="chipTxt">Pick one</span> <span aria-hidden="true">&#9662;</span></button>
    </div>
  </div>
  <div class="menu" id="menu" hidden></div>

  <div class="head"><h2 id="title"></h2><p id="sub"></p></div>
  <div class="screen" id="screen"></div>

  <div class="foot">
    <span class="cap" id="cap"></span>
    <button class="nav" id="back" onclick="go(-1)">&lsaquo; Back</button>
    <button class="nav pri" id="fwd" onclick="fwd()"></button>
  </div>

const SURF = [

  { k:"site", n:"Site",    t:"The pages this loop built" },

];

const STEPS = [
  { s:"Say it",        t:"Say What You Want",  p:"One sentence is the whole brief." },
  { s:"It gets made",  t:"It Gets Made",       p:"Post, page and caption, ready to review." },
  { s:"It goes live",  t:"It Goes Live",       p:"Feed, website, search and answer engines, in one publish." },

  { s:"It decides",    t:"It Writes The Next One", p:"What worked chooses what gets made." }
];

/* ---------------------------------------------------------------- state */
let biz = null, i = 0, cyc = 1, heard = false, published = false, sf = 0, timers = [];
const el = id => document.getElementById(id);
const later = (fn, ms) => timers.push(setTimeout(fn, ms));

function begin() { el("start").hidden = true; render(); }

/* --------------------------------------------------------------- render */
function render() {
  timers.forEach(clearTimeout); timers = [];
  el("track").innerHTML = STEPS.map((_, n) =>
    `<button class="stg ${n === i ? "on" : n < i ? "past" : ""}" aria-label="Step ${n + 1}"
       onclick="jump(${n})"><span class="d"></span><span class="ln"></span></button>`).join("") +
    `<span class="stg ${i === 4 ? "on" : ""}" aria-hidden="true"><span class="d loop"></span></span>`;
  el("stage").textContent = `${i + 1}. ${STEPS[i].s}`;
  el("cycle").textContent = `Cycle ${cyc}`;
  el("title").textContent = STEPS[i].t;
  el("sub").innerHTML = STEPS[i].p;
  el("chipTxt").textContent = biz ? BIZ[biz].name : "Pick one";
  el("cap").innerHTML = biz ? BIZ[biz].who : "Choose an account to begin";
  el("back").disabled = i === 0;
  el("fwd").disabled = !biz;
  el("fwd").innerHTML = pending() || (i === 4
    ? "Start cycle " + (cyc + 1) + " &nbsp;&#8635;" : "Next &rsaquo;");
  el("screen").innerHTML = body();
  el("screen").scrollTop = 0;
  if (i === 4) later(() =>
    document.querySelectorAll(".fil").forEach(f => f.style.width = f.dataset.w + "%"), 70);
}

function body() {
  if (!biz) return `<div class="lbl">Choose an account</div><div class="pick">` +
    Object.entries(BIZ).map(([k, v]) => `<button onclick="choose('${k}')">
      <span class="em">${v.ini}</span>
      <span><span class="nm">${v.name}</span><span class="sb">${v.at}</span></span>
    </button>`).join("") + `</div>`;

  const b = BIZ[biz];
  const bars = n => Array.from({length: n}, (_, x) =>
    `<i style="animation-delay:${x * .1}s"></i>`).join("");

  if (i === 0) {
    const line = cyc === 1 ? b.say : b.next;
    if (!heard) return `<div class="lbl">Tap to speak</div>
      <button class="mic act" onclick="listen()" style="width:100%;text-align:left">
        <span class="orb"><span class="wave">${bars(5)}</span></span>
        <span class="tx"><b>Tap to talk</b>One sentence is the whole brief</span><span class="arrow" aria-hidden="true">&rsaquo;</span></button>` +
      (cyc > 1 ? `<div class="carry"><b>&#8635;</b><span>Cycle ${cyc} opens with the line
        the last cycle wrote for you. Tap to hear it.</span></div>` : "");
    return `<div class="lbl">Heard</div>
      <button class="mic live" id="micbox" onclick="replay()"
              style="width:100%;text-align:left" title="Play it again">
        <span class="orb"><span class="wave">${bars(5)}</span></span>
        <span class="tx"><b id="micst">Listening</b>${b.at}</span>
        <span class="arrow" aria-hidden="true">&#8635;</span></button>
      <div class="said fade"><span class="who">${cyc === 1 ? "You said" : "Written by cycle " + (cyc - 1)}</span><span
        id="tt"></span><i class="caret" id="caret"></i></div>` +
      (cyc > 1 ? `<div class="carry fade"><b>&#8635;</b><span>You did not write this one.
        It came from what the last batch of posts actually did.</span></div>` : "");
  }

  if (i === 1) return `<div class="lbl">Draft &middot; tap any piece</div>
    <div class="made">` + b.assets.map(([kind, cap, spec], n) =>
      `<button class="asset fade" style="animation-delay:${n * 80}ms" onclick="openAsset(${n})">
        <span class="kind">${kind}</span><span class="cap">${cap}</span>
        <span class="frame">${spec}</span></button>`).join("") + `</div>
    <div class="hitl"><span class="dot"></span><span>A person checks every piece
      <b>24 hours before</b> anything publishes. Nothing goes out unreviewed.</span></div>`;

  if (i === 2) {
    if (!published) return `<div class="lbl">Approved and queued</div>
      <button class="mic act" onclick="publish()" style="width:100%;text-align:left">
        <span class="orb"><span class="wave">${bars(5)}</span></span>
        <span class="tx"><b>Publish everywhere</b>Feed, site, search and answers in one go</span><span class="arrow" aria-hidden="true">&rsaquo;</span></button>`;
    return `<div class="lbl">Publishing &middot; live</div><div class="trace" id="tr"></div>`;
  }

  if (i === 3) {
    const bar = `<div class="tabs">` + SURF.map((t, n) =>
      `<button aria-selected="${n === sf}" onclick="pickSurf(${n})">${t.n}</button>`).join("") +
      `</div><div class="lbl">${SURF[sf].t} &middot; tap a row</div>`;

    if (sf === 0) return bar + b.posts.map((p, n) =>
      `<button class="post fade" style="animation-delay:${n * 60}ms" onclick="openPost(${n})">
        <span class="t">${p.t}${tag(p)}<span class="ch" aria-hidden="true">&rsaquo;</span></span>
        <span class="m">${p.m}</span>
        <span class="res">${p.r.map(([k, v, c]) =>
          `<span><span class="k">${k}</span><span class="v ${c}">${v}</span></span>`).join("")}</span>
      </button>`).join("");

    const d = b.surf[SURF[sf].k];
    return bar + DRAW[SURF[sf].k](d) +
      `<div class="read pos"><span class="h">The read</span>${d.note}</div>
       <div class="read gap"><span class="h">The gap</span>${d.flag}</div>`;
  }

  return `<div class="lbl">Engagement by format &middot; tap a bar</div>` +
    b.fmts.map(([n, v, w], x) => `<button class="fmt" onclick="openFmt(${x})">
      <span class="n">${n}</span><span class="trk"><span class="fil" data-w="${w}"></span></span>
      <span class="p">${v}%</span><span class="c" aria-hidden="true">&rsaquo;</span>
    </button>`).join("") +
    `<div class="found">${b.found}</div>
     <div class="brief fade"><div class="h">Next cycle, written for you</div>
       <div class="a">${b.next}</div><div class="w">${b.because}</div></div>`;
}

function pickSurf(n) { sf = n; render(); }

/* Each surface answers a different shape of question, so each gets the chart
   that question deserves -- one accent, one scale, never two axes. */
const row = (n, inner) =>
  `<button class="srow fade" style="animation-delay:${n * 60}ms" onclick="openRow(${n})">
     ${inner}<span class="sc" aria-hidden="true">&rsaquo;</span></button>`;

const DRAW = {
  /* Pages: conversion rate is the comparison, scaled to the best page here. */
  site: d => {
    const top = Math.max(...d.rows.map(r => r[3])) || 1;
    return d.rows.map(([path, sess, conv, rate, secs], n) => row(n, `
      <span class="sk">${path}</span>
      <span class="sm ${conv ? "" : "off"}">${conv}<em>${conv === 1 ? "conv" : "convs"}</em></span>
      <span class="wide"><span class="trk2"><span class="fl2 ${rate ? "" : "zero"}"
        style="width:${Math.max(rate / top * 100, rate ? 3 : 0)}%"></span></span></span>
      <span class="sv">${sess.toLocaleString()} sessions &middot; ${rate.toFixed(2)}%
        <b class="spd ${secs > 3 ? "slow" : ""}">${secs}s</b></span>`)).join("");
  },

  /* Queries: position is the story, so plot it -- 1st at the left, and show
     where it moved from. A flat scale of ranks, not a bar of clicks. */
  seo: d => d.rows.map(([q, pos, prev, clicks], n) => {
    const at = p => Math.min((p - 1) / 29 * 100, 100);
    const miss = pos === 0;
    return row(n, `
      <span class="sk">${q}</span>
      <span class="sm ${miss ? "off" : ""}">${miss ? "--" : ordinal(pos)}</span>
      <span class="wide"><span class="rank">
        ${miss ? `<i class="miss"></i>`
          : `${prev > pos ? `<i class="was" style="left:${at(prev)}%"></i>
               <i class="move" style="left:${at(pos)}%;width:${at(prev) - at(pos)}%"></i>` : ""}
             <i class="now" style="left:${at(pos)}%"></i>`}</span></span>
      <span class="sv">${miss ? "Not ranking" :
        prev > pos ? `up from ${ordinal(prev)}` : "unchanged"} &middot; ${clicks} clicks</span>`);
  }).join("") + `<div class="scale"><span>1st</span><span>15th</span><span>30th+</span></div>`,

  /* Answer engines: cited or not is binary, so count it -- one cell per prompt. */
  geo: d => `<div class="share">
      <div class="cells">${Array.from({length: d.total}, (_, x) =>
        `<i class="${x < d.cited ? "on" : ""}"></i>`).join("")}</div>
      <div class="sharen">Quoted in <b>${d.cited}</b> of ${d.total} prompts tracked</div>
    </div>` +
    d.rows.map(([prompt, cited, src], n) => row(n, `
      <span class="sk">${prompt}</span>
      <span class="sm ${cited ? "" : "off"}">${cited ? "Quoted" : "Missed"}</span>
      <span class="wide"><span class="mark ${cited ? "on" : ""}"></span>
        <span class="srcp">${src}</span></span>`)).join(""),

  /* Creators: the point is the mismatch, so show both bars on one scale each. */
  crt: d => {
    const mr = Math.max(...d.rows.map(r => r[1])), mv = Math.max(...d.rows.map(r => r[2])) || 1;
    return d.rows.map(([who, reach, ret, label], n) => row(n, `
      <span class="sk">${who}</span>
      <span class="sm ${ret ? "" : "off"}">${label}</span>
      <span class="wide">
        <span class="pair"><em>reach</em><span class="trk2"><span class="fl2 ghost"
          style="width:${reach / mr * 100}%"></span></span><b>${(reach / 1000)}k</b></span>
        <span class="pair"><em>return</em><span class="trk2"><span class="fl2 ${ret ? "" : "zero"}"
          style="width:${Math.max(ret / mv * 100, ret ? 3 : 0)}%"></span></span><b>${ret}</b></span>
      </span>`)).join("");
  }
};

function ordinal(n) {
  const t = n % 100;
  return n + (t > 3 && t < 21 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th");
}

/* The last metric on every card is the one that pays rent. The label reads off it. */
function tag(p) {
  const lead = p.r[3];
  if (lead[1] === "0") return `<span class="tag no">No return</span>`;
  if (lead[2] === "up") return `<span class="tag yes">Converting</span>`;
  return "";
}

/* ----------------------------------------------------------------- taps */
function choose(k) {
  stopVoice();
  biz = k; i = 0; cyc = 1; heard = false; published = false; sf = 0;
  el("menu").hidden = true;
  render();
}
/* --------------------------------------------------------------- voice
   The line is spoken aloud and the transcript fills in behind it, driven by
   the synthesiser's own word boundaries -- so the text lands with the voice
   rather than on a guessed timer. Falls back to a paced reveal wherever
   boundary events are not delivered (Safari, some Android engines). */
let voices = [], sound = true, said = "";

function loadVoices() { voices = (window.speechSynthesis || {}).getVoices ? speechSynthesis.getVoices() : []; }
if (window.speechSynthesis) {
  loadVoices();
  speechSynthesis.addEventListener("voiceschanged", loadVoices);
}

/* Ordered by how human it sounds. The legacy Microsoft desktop voices (David,
   Mark, Zira) are last resort -- they are the ones that break the illusion. */
const VOICE_RANK = [
  /natural|neural/i,
  /google (uk|us)/i,
  /samantha|siri|aria|jenny|sonia|libby|ava/i,
  /google/i
];

function pickVoice() {
  const en = voices.filter(v => /^en(-|$)/i.test(v.lang));
  if (!en.length) return null;
  for (const rank of VOICE_RANK) {
    const hit = en.find(v => rank.test(v.name));
    if (hit) return hit;
  }
  return en.find(v => !/david|mark|zira/i.test(v.name)) || en[0];
}

function show(txt) {
  const t = el("tt");
  if (t) t.textContent = txt;
  const s = el("screen");
  if (s) s.scrollTop = 9e5;
}

function endSpeech() {
  const c = el("caret"), m = el("micbox"), st = el("micst");
  if (c) c.remove();
  if (m) m.classList.remove("live");
  if (st) st.textContent = "Transcribed";
}

/* paced reveal -- also the whole implementation when sound is off */
function reveal(text, done) {
  const words = text.split(" ");
  let n = 0;
  const step = () => {
    n++;
    show(words.slice(0, n).join(" "));
    if (n < words.length) timers.push(setTimeout(step, 90 + words[n - 1].length * 34));
    else done();
  };
  step();
}

function transcribe(text) {
  said = text;
  if (!sound || !window.speechSynthesis) return reveal(text, endSpeech);

  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice();
  if (v) u.voice = v;
  u.rate = 0.97; u.pitch = 1.02;

  let boundaries = 0;
  u.onboundary = e => {
    if (e.charIndex == null) return;
    boundaries++;
    const nextSpace = text.indexOf(" ", e.charIndex);
    show(text.slice(0, nextSpace === -1 ? text.length : nextSpace));
  };
  u.onend = () => { show(text); endSpeech(); };
  u.onerror = () => { show(text); endSpeech(); };
  speechSynthesis.speak(u);

  // If the engine never reports word boundaries, pace it ourselves instead.
  timers.push(setTimeout(() => {
    if (!boundaries) reveal(text, () => {});
  }, 700));
}

function stopVoice() {
  if (window.speechSynthesis) speechSynthesis.cancel();
}

function toggleSound() {
  sound = !sound;
  el("snd").setAttribute("aria-pressed", sound);
  el("snd").textContent = sound ? "Sound" : "Muted";
  if (!sound) { stopVoice(); show(said); endSpeech(); }
}

function replay() { stopVoice(); listen(); }

function listen() {
  heard = true;
  render();
  transcribe(cyc === 1 ? BIZ[biz].say : BIZ[biz].next);
}

function publish() {
  published = true; render();
  const b = BIZ[biz], box = el("tr");
  b.live.forEach(([src, txt, cls], n) => later(() => {
    box.insertAdjacentHTML("beforeend",
      `<div class="ev ${cls} fade"><span class="dot"></span>
         <span><span class="src">${src}</span>${txt}</span></div>`);
    el("screen").scrollTop = 9e5;
    if (n === b.live.length - 1) render_fwd();
  }, 520 * n + 180));
}
function render_fwd() { el("fwd").disabled = false; }

/* A step can owe an action before it can be left. Next carries it out rather
   than sitting disabled, so there is never a tap that does nothing. */
function pending() {
  if (i === 0 && !heard) return "Speak it &nbsp;&rsaquo;";
  if (i === 2 && !published) return "Publish it &nbsp;&rsaquo;";
  return null;
}

function fwd() {  stopVoice();

  if (i === 0 && !heard) return listen();
  if (i === 2 && !published) return publish();
  if (i < 4) { i++; return render(); }
  cyc++; i = 0; heard = false; published = false; sf = 0; render();   // the loop closes
}
function go(d) { stopVoice(); i = Math.max(0, i + d); render(); }
function jump(n) {
  stopVoice();
  if (!biz) return;
  if (n > 0) heard = true;          // skipping ahead implies the earlier beats
  if (n > 2) published = true;
  i = n; render();
}

/* --------------------------------------------------------------- sheets */
function sheet(title, sub, rows) {
  el("scrim").hidden = false;
  const s = el("sheet");
  s.hidden = false;
  s.innerHTML = `<div class="grab"></div><h3>${title}</h3><div class="sub">${sub}</div>` +
    rows.map(([k, v]) => `<div class="row"><span class="rk">${k}</span><span class="rv">${v}</span></div>`).join("") +
    `<button class="close" onclick="shut()">Close</button>`;
  s.scrollTop = 0;
}
function shut() { el("sheet").hidden = true; el("scrim").hidden = true; }

function openAsset(n) {
  const [kind, cap, spec] = BIZ[biz].assets[n];
  sheet(cap, `${kind} &middot; ${spec}`, [
    ["Where it goes", kind === "Page"
      ? "Published to the site and submitted to search, with the sitemap updated."
      : "Scheduled to the feed at the hour that has performed best for this account."],
    ["Who approves it", "A person reviews it 24 hours before it publishes. Nothing goes out unreviewed."],
    ["What comes back", "Once it is live, its reach, saves and enquiries attach to it here -- that is step 4."]
  ]);
}
function openPost(n) {
  const p = BIZ[biz].posts[n];
  sheet(p.t, p.m.replace(/&middot;/g, "-"), p.why);
}
function openRow(n) {
  const k = SURF[sf].k, d = BIZ[biz].surf[k], r = d.rows[n];
  const spec = {
    site: () => [r[0], `${r[1].toLocaleString()} sessions &middot; ${r[3].toFixed(2)}% convert`,
      [["What happened", r[5]],
       ["Speed", r[4] > 3 ? `Loads in ${r[4]}s on mobile. Past two seconds, roughly 7% of `
         + `visits are lost for every extra second.` : `Loads in ${r[4]}s on mobile. Healthy.`],
       ["Feeds the next brief", d.flag]]],
    seo: () => [r[0], r[1] ? `${ordinal(r[1])} &middot; ${r[3]} clicks` : "Not ranking",
      [["What happened", r[4]],
       ["Movement", r[1] === 0 ? "No page on the site targets this query yet."
         : r[2] > r[1] ? `Up ${r[2] - r[1]} places, from ${ordinal(r[2])} to ${ordinal(r[1])}.`
         : `Held at ${ordinal(r[1])} across the quarter.`],
       ["Feeds the next brief", d.flag]]],
    geo: () => [r[0], r[1] ? "Quoted by answer engines" : "Not quoted",
      [["What happened", r[3]],
       ["Source", r[1] ? `Answer engines quote <b>${r[2]}</b>.` : `Nothing here is quotable, so ${r[2].toLowerCase()}.`],
       ["Feeds the next brief", d.flag]]],
    crt: () => [r[0], `${(r[1] / 1000)}k reach &middot; ${r[3]}`,
      [["What happened", r[4]],
       ["Reach against return", r[2]
         ? `${(r[1] / 1000)}k reach turned into ${r[3]}. That ratio, not the follower count, is what to book on.`
         : `${(r[1] / 1000)}k reach returned nothing. The audience is large and in the wrong place.`],
       ["Feeds the next brief", d.flag]]]
  }[k]();
  sheet(spec[0], spec[1], spec[2]);
}

function openFmt(n) {
  const b = BIZ[biz], [nm, v, , detail] = b.fmts[n];
  sheet(nm, `${v}% average engagement over 90 days`, [
    ["What is in it", detail],
    ["Against the rest", n === 0
      ? "The best format on this account. Everything else is measured against it."
      : `About ${(b.fmts[0][1] / v).toFixed(1)}x behind ${b.fmts[0][0].toLowerCase()}.`],
    ["What happens next", n === 0
      ? "The next cycle opens by asking for more of these."
      : v < 2 ? "Dropped from the next cycle. It is taking a slot that could earn."
              : "Kept as filler, but it will not lead the week."]
  ]);
}

/* -------------------------------------------------------------- chooser */
function toggleMenu() {
  const m = el("menu");
  m.hidden = !m.hidden;
  m.innerHTML = Object.entries(BIZ).map(([k, v]) =>
    `<button onclick="choose('${k}')">${v.name}</button>`).join("");
}
document.addEventListener("click", e => {
  if (!e.target.closest("#menu") && !e.target.closest("#chip")) el("menu").hidden = true;
});
document.addEventListener("keydown", e => { if (e.key === "Escape") shut(); });

render();
</script>
